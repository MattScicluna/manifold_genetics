# UKBB embedded on its own, using a geometric sketch as the fit subset.
#
#   manifold-genetics run examples/ukbb/geosketch_phate/config.yaml --dry-run
#
# Select the sketch first with prepare_data.sh. Paths are relative to this file.
#
# The sketch is selected in PCA space, not on genotypes: geometric sketching on
# 486,748 x 120,849 raw dosages would take far too long, and PCA coordinates are
# what the sketch is meant to be representative of anyway. prepare_data.sh reads
# an existing PCA CSV to do it, so this example depends on an earlier run having
# produced one -- see its header. That dependency is the only thing unusual here;
# the pipeline itself still starts from PLINK files like every other example.
#
# Identical settings to 10k_WB_5K_Irish on purpose: how the fit subset was chosen
# (geometric sketch vs majority-capping) should not change how it is embedded.
# A 2026-09-10 comparison at matched settings found the two give the same branch
# topology, differing only in the European region.
preset: subsample

data:
  fit_plink: data/fit_subset
  project_plink: data/project_subset
  fit_labels: data/fit_labels.csv
  project_labels: data/project_labels.csv
  colormap: ../../colormaps/ukbb.json
  output_dir: outputs

pca:
  n_pcs: 20

admixture:
  k_min: 2
  k_max: 10

embedding:
  method: phate

visualization:
  admix_group_column: self_described_ancestry
