name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
      fail-fast: false
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Install uv
        uses: astral-sh/setup-uv@v4
      
      - name: Cache uv dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/uv
          key: uv-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-py${{ matrix.python-version }}-
      
      - name: Verify uv.lock is up to date
        run: |
          uv lock
          git diff --exit-code uv.lock
      
      - name: Install dependencies
        run: |
          uv sync --frozen --extra dev
      
      - name: Run tests
        run: |
          uv run pytest -m "not slow and not integration and not network" --cov=manifold_genetics --cov-report=term-missing --cov-report=xml
      
      - name: Upload coverage to Coveralls
        if: matrix.python-version == '3.12'
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.COVERALLS_REPO_TOKEN }}
      
      - name: Debug info on failure
        if: failure()
        run: |
          echo "=== Python Version ==="
          python -V
          echo "=== uv Version ==="
          uv --version
          echo "=== Installed Packages ==="
          uv pip freeze

  lint:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      
      - name: Install uv
        uses: astral-sh/setup-uv@v4
      
      - name: Cache uv dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/uv
          key: uv-${{ runner.os }}-py3.11-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-py3.11-
      
      - name: Install dependencies
        run: |
          uv sync --frozen --extra dev
      
      - name: Run black
        run: |
          uv run black --check .
      
      - name: Run isort
        run: |
          uv run isort --check-only .
      
      - name: Run flake8
        run: |
          uv run flake8 src tests
