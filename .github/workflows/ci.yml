name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    # The name is pinned rather than left to the matrix. Adding `os` renamed
    # these jobs to "test (ubuntu-latest, 3.10)", which silently orphaned the
    # three checks the protect-main ruleset requires by their old names --
    # every job passed and the merge blocked forever waiting for checks that no
    # longer existed. Keeping the names stable decouples the branch rules from
    # the shape of the matrix, so adding a platform never breaks a merge again.
    name: test (${{ matrix.python-version }})${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12"]
        # macOS matters more here than the job count suggests: flashpca ships
        # only for Linux x86-64, so the pure-Python PCA backend is the only way
        # PCA runs on a Mac -- and until this was added, that backend never
        # executed on one. The .bed reader does its own byte-level unpacking,
        # which is exactly the kind of code that is platform-sensitive.
        #
        # One version rather than three: the platform is what is being covered,
        # not the Python matrix, which Linux already spans.
        include:
          - os: macos-latest
            python-version: "3.12"
            # Distinguishes this from the ubuntu 3.12 job, which would otherwise
            # share its name. Undefined for the ubuntu entries, which renders as
            # an empty string.
            label: " macOS"
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          # Pinned so the `uv lock` drift check below is deterministic. Unpinned,
          # CI installs whatever uv is latest that day, and a lock file written by
          # a different version fails the check for reasons unrelated to the PR.
          version: "0.12.13"

      - name: Cache uv dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/uv
          key: uv-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-py${{ matrix.python-version }}-

      - name: Verify uv.lock is up to date
        run: |
          uv lock
          git diff --exit-code uv.lock

      - name: Install dependencies
        run: |
          uv sync --frozen --extra dev

      # `integration` is no longer deselected: since the PCA step gained an
      # in-process backend, the pipeline runs end to end on a runner with no
      # flashpca binary. Those are the tests that would catch a scientific
      # regression, so they are the ones worth running here.
      - name: Run tests
        run: |
          uv run pytest -m "not slow and not network" --cov=manifold_genetics --cov-report=term-missing --cov-report=lcov

      # Informational, and not a gate (see issue #94), so it must not be able to
      # block a merge. It already has once: the action failed with "Failed to
      # download coveralls binary or checksum", a third-party download outage
      # that has nothing to do with the pull request it blocked.
      - name: Upload coverage to Coveralls
        if: matrix.python-version == '3.12' && matrix.os == 'ubuntu-latest'
        continue-on-error: true
        uses: coverallsapp/github-action@v2
        with:
          # LCOV preserves coverage.py's line data exactly; the Cobertura XML
          # path made Coveralls undercount by ~2 points.
          file: coverage.lcov
          format: lcov
        env:
          COVERALLS_REPO_TOKEN: ${{ secrets.COVERALLS_REPO_TOKEN }}

      - name: Debug info on failure
        if: failure()
        run: |
          echo "=== Python Version ==="
          python -V
          echo "=== uv Version ==="
          uv --version
          echo "=== Installed Packages ==="
          uv pip freeze

  # Runs before anything expensive, because what it guards against is permanent:
  # this repository is public and lives on a cluster holding controlled-access
  # cohorts. See scripts/check_sensitive_files.py for the two incidents that prompted
  # it. Stdlib only, so it needs no environment.
  leak-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check every tracked file
        run: python -m scripts.check_sensitive_files --tracked

  # The packaging tests need an index to resolve the build backend, so they carry
  # the `network` marker and the job above deselects them. They check things that
  # are permanent once published -- the declared licence, that no untracked file
  # is in the sdist -- so they get a job rather than being skipped.
  package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.12.13"

      - name: Install dependencies
        run: |
          uv sync --frozen --extra dev

      - name: Verify package metadata and distribution contents
        run: |
          uv run pytest tests/unit/test_package_metadata.py \
                        tests/integration/test_sdist_contents.py \
                        -m "network or not network" -v

  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          # Pinned so the `uv lock` drift check below is deterministic. Unpinned,
          # CI installs whatever uv is latest that day, and a lock file written by
          # a different version fails the check for reasons unrelated to the PR.
          version: "0.12.13"

      - name: Cache uv dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/uv
          key: uv-${{ runner.os }}-py3.11-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-py3.11-

      - name: Install dependencies
        run: |
          uv sync --frozen --extra dev

      - name: Run black
        run: |
          uv run black --check .

      - name: Run isort
        run: |
          uv run isort --check-only .

      - name: Run flake8
        run: |
          # Flags live in .flake8 so a local `flake8 src tests` matches CI exactly.
          uv run flake8 src tests

  # The Nextflow workflow (main.nf): both profiles' wiring in stub mode, then a
  # real no_admixture run on the synthetic cohort with the package from this
  # checkout (`-profile local`, no container).
  nextflow:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Java (for Nextflow)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.12.13"

      - name: Install the package and Nextflow
        run: |
          uv sync --frozen --extra dev
          curl -s https://get.nextflow.io | bash
          sudo mv nextflow /usr/local/bin/

      - name: Synthetic cohort
        run: uv run manifold-genetics acquire synthetic --out /tmp/syn

      - name: Stub runs (both profiles)
        run: |
          for profile in full no_admixture; do
            nextflow run main.nf -profile "$profile,local" -stub \
              --fit_plink /tmp/syn/data/fit_subset --project_plink /tmp/syn/data/project_subset \
              --labels /tmp/syn/data/labels.csv --colormap /tmp/syn/colormap.json \
              --outdir "/tmp/stub_$profile" --cpus 2 --memory '4 GB'
          done
          test -f /tmp/stub_full/results/admixture/Q.txt
          test ! -e /tmp/stub_no_admixture/results/admixture

      - name: Real no_admixture run
        run: |
          source .venv/bin/activate
          nextflow run main.nf -profile no_admixture,local \
            --fit_plink /tmp/syn/data/fit_subset --project_plink /tmp/syn/data/project_subset \
            --labels /tmp/syn/data/labels.csv --colormap /tmp/syn/colormap.json \
            --outdir /tmp/real --cpus 2 --memory '6 GB' --n_pcs 10
          ls /tmp/real/results/pca/fit_pca_10.csv /tmp/real/results/embeddings/phate_2d.csv
          test ! -e /tmp/real/results/admixture

  # The workflow's container builds, with the external tools baked in.
  container:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build the image
        run: docker build --platform linux/amd64 -t manifold-genetics:ci .

      - name: Tools and entry point are present
        run: |
          docker run --rm manifold-genetics:ci sh -c '
            manifold-genetics --help > /dev/null &&
            ls /opt/manifold-tools &&
            python -c "import torch, neural_admixture, plotly, imageio_ffmpeg, pandas_gbq; print(\"extras ok\")" &&
            command -v gsutil && command -v bq && command -v gcloud &&
            test -s /opt/manifold-tools/preprocessing/giab/GRCh38_alldifficultregions.bed &&
            grep -q "version = .4.3" /opt/manifold-tools/preprocessing/wrayner/HRC-1000G-check-bim.pl &&
            perl -c /opt/manifold-tools/preprocessing/wrayner/HRC-1000G-check-bim.pl'

  # The WDL version of the workflow (Cromwell, e.g. Verily Workbench) is valid,
  # alone and with its example inputs.
  wdl:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Validate with womtool
        run: |
          curl -sSL -o womtool.jar https://github.com/broadinstitute/cromwell/releases/download/92/womtool-92.jar
          for wdl in *.wdl; do
            java -jar womtool.jar validate "$wdl"
          done
          for inputs in wdl/inputs.*.json; do
            java -jar womtool.jar validate manifold_genetics.wdl -i "$inputs"
          done
          java -jar womtool.jar validate aou_prepare.wdl -i wdl/aou_prepare.inputs.json
          java -jar womtool.jar validate analyse.wdl -i wdl/analyse.inputs.json
          java -jar womtool.jar validate analyse.wdl -i wdl/analyse.biobank.inputs.json
          java -jar womtool.jar validate prepare.wdl -i wdl/prepare.inputs.json
