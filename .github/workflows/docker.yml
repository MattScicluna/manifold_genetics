# Publish the workflow container to Docker Hub, where All of Us workspaces pull
# it through their Artifact Registry proxy for Docker Hub.
#
#   push to main            -> mattscicluna/manifold-genetics:main
#   push to verily-workflow -> mattscicluna/manifold-genetics:verily-workflow
#   tag vX.Y.Z              -> mattscicluna/manifold-genetics:X.Y.Z and :latest
#   every publish           -> mattscicluna/manifold-genetics:sha-<commit>
#   GPU variant (admixture.wdl): the same tags with a -gpu suffix
#
# Needs repository secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN (a Docker Hub
# access token with read & write). Pull requests only build the image (ci.yml).
name: Publish container

on:
  push:
    branches: [main, verily-workflow]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: cpu
            suffix: ""
            build-args: ""
          - variant: gpu
            suffix: "-gpu"
            build-args: |
              BASE=nvidia/cuda:12.1.1-devel-ubuntu22.04
              TORCH_INDEX=https://download.pytorch.org/whl/cu121
    env:
      IMAGE: docker.io/mattscicluna/manifold-genetics
      HAVE_TOKEN: ${{ secrets.DOCKERHUB_TOKEN != '' }}

    steps:
      - name: Skip without Docker Hub credentials
        if: env.HAVE_TOKEN != 'true'
        run: echo "::notice::DOCKERHUB_TOKEN is not set; nothing published."

      - name: Checkout code
        if: env.HAVE_TOKEN == 'true'
        uses: actions/checkout@v4

      - name: Free disk space (the CUDA image is large)
        if: env.HAVE_TOKEN == 'true' && matrix.variant == 'gpu'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Set up Docker Buildx
        if: env.HAVE_TOKEN == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: env.HAVE_TOKEN == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tags
        if: env.HAVE_TOKEN == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: suffix=${{ matrix.suffix }},onlatest=true
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha,prefix=sha-,format=short

      - name: Build and push (linux/amd64)
        if: env.HAVE_TOKEN == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.build-args }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}
