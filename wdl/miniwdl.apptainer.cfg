# miniwdl on a cluster without Docker: the same image, run by Apptainer.
#
#   MINIWDL_CFG=wdl/miniwdl.apptainer.cfg miniwdl run prepare.wdl -i inputs.json
#
# Inside a batch job, since the tasks are heavy. Compute nodes often have no
# internet, so pull the image once on a node that does, under the name
# miniwdl looks for in image_cache:
#
#   apptainer pull <image_cache>/docker___mattscicluna_manifold-genetics_<tag>.sif \
#       docker://mattscicluna/manifold-genetics:<tag>

[scheduler]
container_backend = singularity

[singularity]
# `singularity` also works where that is the installed name.
exe = ["apptainer"]
# Bind the filesystems holding your inputs and output_dir (results are copied
# there from inside the container). No --fakeroot: clusters rarely allow it.
run_options = ["--containall", "--no-mount", "hostfs", "--bind", "/path/to/data,/path/to/results"]
image_cache = "/path/to/sif_cache"

[file_io]
# analyse.wdl builds its file paths from cohort_dir (a String), as Cromwell
# allows; miniwdl refuses that unless told to.
allow_any_input = true

[task_runtime]
# Your job's allocation, not the node's: miniwdl schedules tasks within these.
cpu_max = 32
memory_max = 240G
