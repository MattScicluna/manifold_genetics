[build-system]
requires = ["hatchling>=1.27"]  # >=1.27 for PEP 639 license-expression support
build-backend = "hatchling.build"

[project]
name = "manifold-genetics"
version = "0.2.1"
description = "A lightweight, batteries-included package for genetic analysis with PCA, Admixture, and manifold learning"
readme = "README.md"
requires-python =  ">=3.10,<3.13"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [
    {name = "Matthew Scicluna", email = "mattcscicluna@gmail.com"},
]
keywords = ["genetics", "genomics", "pca", "admixture", "dimensionality-reduction", "manifold-learning", "visualization"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

dependencies = [
    "numpy>=1.20.0",
    "pandas>=1.3.0",
    "scipy>=1.7.0",
    "scikit-learn>=1.0.0",
    "matplotlib>=3.4.0",
    "seaborn>=0.11.0",
    "tqdm>=4.60.0",
    "numba>=0.57",
    # Config files for `manifold-genetics run`. Present transitively today, which
    # is not the same as being guaranteed.
    "pyyaml>=6.0",
    # Where downloaded binaries are cached. Getting per-user cache directories
    # right across Linux, macOS and Windows is not worth hand-rolling.
    "platformdirs>=3.0",
    # Dimensionality reduction
    "phate>=2.0.0",
    "umap-learn>=0.5.0",
    "llvmlite>=0.40",
]

[project.optional-dependencies]
admixture = [
    "torch>=1.10.0",
    "neural-admixture==1.6.7",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=3.0.0",
    "black>=22.0.0",
    "isort>=5.10.0",
    "flake8>=4.0.0",
    # tests/unit/test_package_metadata.py reads pyproject.toml; tomllib is
    # stdlib only from 3.11.
    "tomli>=2.0; python_version<'3.11'",
    # Installs the guardrail hooks: uv run pre-commit install
    "pre-commit>=3.5",
]
aou = [
    "pandas-gbq>=0.19.0",
]
geosketch = [
    "geosketch>=1.3",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.25",
    # Renders docs/tutorial.ipynb, and executes it during the build so a tutorial
    # cannot quietly stop working.
    "mkdocs-jupyter>=0.24",
    "ipykernel>=6.29",
]

[project.scripts]
manifold-genetics = "manifold_genetics.cli:main"

[project.urls]
Homepage = "https://github.com/MattScicluna/manifold_genetics"
Documentation = "https://mattscicluna.github.io/manifold_genetics/"
Repository = "https://github.com/MattScicluna/manifold_genetics"
Issues = "https://github.com/MattScicluna/manifold_genetics/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/manifold_genetics"]

[tool.hatch.build.targets.sdist]
# hatchling's default is "everything not gitignored", which includes untracked
# working files. Left at the default, the 0.2.0 sdist carried
# .claude/settings.local.json and a script whose header says "NOT for external
# users" -- neither tracked in git, both about to be published.
#
# An sdist is a build artefact, not a mirror of the repository: it needs the
# package, its tests, and the files that describe the release. Examples, docs
# and screenshots live in the repository, where they can be read without
# downloading a tarball. tests/integration/test_sdist_contents.py enforces this.
only-include = [
    "src/manifold_genetics",
    "tests",
    # tests/unit/test_sensitive_file_check.py imports it, and the sdist ships
    # tests, so it has to ship what they import.
    "scripts",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
    "pyproject.toml",
    ".flake8",
]
exclude = [
    "**/__pycache__",
    "**/.ipynb_checkpoints",
    "**/*.pyc",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "slow: marks tests as slow (true admixture compute, large datasets)",
    "integration: marks tests as integration tests (multi-module, filesystem)",
    "network: marks tests requiring network access (downloads, remote data)",
    "requires_private_data: marks tests needing controlled-access cohorts (UK Biobank, All of Us); they skip when the data is absent",
]

[tool.black]
line-length = 100
target-version = ['py39']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 100
