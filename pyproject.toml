[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "manifold-genetics"
version = "0.1.0"
description = "A lightweight, batteries-included package for genetic analysis with PCA, Admixture, and manifold learning"
readme = "README.md"
requires-python =  ">=3.10,<3.13"
license = {text = "MIT"}
authors = [
    {name = "Your Name", email = "your.email@example.com"},
]
keywords = ["genetics", "genomics", "pca", "admixture", "dimensionality-reduction", "manifold-learning", "visualization"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

dependencies = [
    "numpy>=1.20.0",
    "pandas>=1.3.0",
    "scipy>=1.7.0",
    "scikit-learn>=1.0.0",
    "matplotlib>=3.4.0",
    "seaborn>=0.11.0",
    "pytest>=7.0.0",
    "tqdm>=4.60.0",
    "numba>=0.57",
    # Dimensionality reduction
    "phate>=2.0.0",
    "umap-learn>=0.5.0",
    "llvmlite>=0.40",
    # Neural admixture
    "torch>=1.10.0",
    "neural-admixture==1.6.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=3.0.0",
    "black>=22.0.0",
    "isort>=5.10.0",
    "flake8>=4.0.0",
]
aou = [
    "pandas-gbq>=0.19.0",
]

[project.scripts]
manifold-genetics = "manifold_genetics.cli:main"

[project.urls]
Homepage = "https://github.com/yourusername/manifold-genetics"
Documentation = "https://github.com/yourusername/manifold-genetics#readme"
Repository = "https://github.com/yourusername/manifold-genetics"
Issues = "https://github.com/yourusername/manifold-genetics/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/manifold_genetics"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "slow: marks tests as slow (true admixture compute, large datasets)",
    "integration: marks tests as integration tests (multi-module, filesystem)",
    "network: marks tests requiring network access (downloads, remote data)",
]

[tool.black]
line-length = 100
target-version = ['py39']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 100
